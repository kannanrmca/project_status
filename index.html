<body>
  <main class="app">
    <header class="header">
      <p class="eyebrow">Project Rollout</p>
      <h1>Regional Status Dashboard</h1>
      <p class="subtitle">
        Select a region to view rollout progress and upcoming milestones.
      </p>
    </header>

    <section
      id="regionPills"
      class="region-pills"
      aria-label="Regions"
    >
      <div class="loading">Loading regional status...</div>
    </section>

    <section id="detailPanel" class="detail-panel">
      <div class="empty-state">
        <div class="empty-state-content">
          <div class="empty-icon">◎</div>
          <h2>Select a region</h2>
          <p>
            Choose a region above to view its current rollout status,
            accomplishments, and next milestone.
          </p>
        </div>
      </div>
    </section>
  </main>

  <script>
    const CSV_FILE = "region_status.csv";

    const regionPills = document.getElementById("regionPills");
    const detailPanel = document.getElementById("detailPanel");

    /*
     * Basic CSV parser.
     * Handles quoted values containing commas and escaped quotes.
     */
    function parseCSV(csvText) {
      const rows = [];
      let row = [];
      let value = "";
      let insideQuotes = false;

      for (let i = 0; i < csvText.length; i++) {
        const char = csvText[i];
        const nextChar = csvText[i + 1];

        if (char === '"' && insideQuotes && nextChar === '"') {
          value += '"';
          i++;
        } else if (char === '"') {
          insideQuotes = !insideQuotes;
        } else if (char === "," && !insideQuotes) {
          row.push(value.trim());
          value = "";
        } else if (
          (char === "\n" || char === "\r") &&
          !insideQuotes
        ) {
          if (char === "\r" && nextChar === "\n") {
            i++;
          }

          row.push(value.trim());
          value = "";

          if (row.some(cell => cell !== "")) {
            rows.push(row);
          }

          row = [];
        } else {
          value += char;
        }
      }

      if (value !== "" || row.length > 0) {
        row.push(value.trim());

        if (row.some(cell => cell !== "")) {
          rows.push(row);
        }
      }

      if (!rows.length) {
        return [];
      }

      const headers = rows[0];

      return rows.slice(1).map(cells => {
        const record = {};

        headers.forEach((header, index) => {
          record[header] = cells[index] || "";
        });

        return record;
      });
    }

    function normalizeStatus(status) {
      const value = String(status || "").trim().toLowerCase();

      if (value.includes("green") || value.includes("on track")) {
        return "green";
      }

      if (
        value.includes("yellow") ||
        value.includes("at risk") ||
        value.includes("warning")
      ) {
        return "yellow";
      }

      if (
        value.includes("red") ||
        value.includes("blocked") ||
        value.includes("critical")
      ) {
        return "red";
      }

      return "yellow";
    }

    function escapeHTML(value) {
      return String(value || "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }

    function formatDate(dateValue) {
      if (!dateValue) {
        return "Date not specified";
      }

      const date = new Date(dateValue);

      if (Number.isNaN(date.getTime())) {
        return escapeHTML(dateValue);
      }

      return date.toLocaleDateString(undefined, {
        year: "numeric",
        month: "short",
        day: "numeric"
      });
    }

    function renderRegionPills(regions) {
      regionPills.innerHTML = "";

      regions.forEach((region, index) => {
        const status = normalizeStatus(region.Status);

        const pill = document.createElement("button");
        pill.type = "button";
        pill.className = "region-pill";
        pill.dataset.index = index;

        pill.innerHTML = `
          <span class="status-dot status-${status}"
                aria-hidden="true"></span>
          <span>${escapeHTML(region.Region)}</span>
        `;

        pill.addEventListener("click", () => {
          document
            .querySelectorAll(".region-pill")
            .forEach(item => item.classList.remove("active"));

          pill.classList.add("active");
          renderDetail(regions[index]);
        });

        regionPills.appendChild(pill);
      });

      if (regions.length > 0) {
        regionPills.firstElementChild.click();
      }
    }

    function renderDetail(region) {
      const status = normalizeStatus(region.Status);

      const accomplishments = [
        region.Accomplishment_1,
        region.Accomplishment_2,
        region.Accomplishment_3
      ].filter(Boolean);

      detailPanel.innerHTML = `
        <div class="detail-header">
          <div>
            <h2 class="region-name">
              ${escapeHTML(region.Region)}
            </h2>

            ${
              region.Last_Updated
                ? `<p class="last-updated">
                    Last updated ${escapeHTML(region.Last_Updated)}
                  </p>`
                : ""
            }
          </div>

          <div class="status-label ${status}">
            <span class="status-dot status-${status}"
                  aria-hidden="true"></span>
            ${escapeHTML(region.Status || "Status unavailable")}
          </div>
        </div>

        <div class="detail-grid">
          <div>
            <h3 class="section-title">Top Accomplishments</h3>

            <div class="accomplishments">
              ${
                accomplishments.length
                  ? accomplishments
                      .map(
                        item => `
                          <div class="accomplishment">
                            <span class="check">✓</span>
                            <span>${escapeHTML(item)}</span>
                          </div>
                        `
                      )
                      .join("")
                  : `<div class="accomplishment">
                       No accomplishments recorded.
                     </div>`
              }
            </div>
          </div>

          <div>
            <h3 class="section-title">Next Milestone</h3>

            <div class="milestone-card">
              <p class="milestone-date">
                ${formatDate(region.Milestone_Date)}
              </p>

              <p class="milestone-label">
                ${escapeHTML(
                  region.Milestone_Label || "Milestone not specified"
                )}
              </p>
            </div>
          </div>
        </div>
      `;
    }

    async function loadRegionStatus() {
      try {
        const response = await fetch(CSV_FILE, {
          cache: "no-store"
        });

        if (!response.ok) {
          throw new Error(
            `Unable to load ${CSV_FILE} (${response.status})`
          );
        }

        const csvText = await response.text();
        const regions = parseCSV(csvText);

        if (!regions.length) {
          throw new Error("The CSV file contains no region records.");
        }

        renderRegionPills(regions);
      } catch (error) {
        console.error(error);

        regionPills.innerHTML = `
          <div class="error">
            Unable to load regional status data.
            Please check that <strong>${CSV_FILE}</strong>
            is in the same folder.
          </div>
        `;
      }
    }

    loadRegionStatus();
  </script>
</body>
</html>
